# SonarQube 项目配置
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# ========== 项目标识 ==========
sonar.projectKey=your-project-key
sonar.projectName=Your Project Name
sonar.projectVersion=1.0

# ========== 项目结构 ==========
# 源代码目录（多个用逗号分隔）
sonar.sources=src
# 测试代码目录
sonar.test=test,tests,__tests__
# 排除的文件/目录
sonar.exclusions=**/*.test.js,**/*.spec.js,**/node_modules/**,*//dist/**,*//build/**,*//coverage/**

# ========== 语言特定配置 ==========
# JavaScript/TypeScript
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Python
sonar.python.file.suffixes=.py
sonar.python.coverage.reportPaths=coverage.xml

# Java
sonar.java.file.suffixes=.java
sonar.java.binaries=build/classes
sonar.java.libraries=**/*.jar
sonar.java.test.binaries=build/test-classes
sonar.java.test.libraries=**/*.jar
sonar.java.coverage.reportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# ========== 质量配置 ==========
# 最小代码覆盖率（%）
sonar.coverage.minimumCoverage=80
# 最小分支覆盖率（%）
sonar.coverage.minimumBranchCoverage=70

# 复杂度阈值
sonar.complexity.threshold=10
sonar.cognitive.complexity.threshold=15

# 重复代码阈值
sonar.duplication.threshold=10  # 最小重复行数
sonar.cpd.minimumTokens=50     # 最小重复 tokens

# ========== 安全配置 ==========
# 启用安全规则
sonar.security.hotspots.check=true
sonar.security.owasp.top10=2021
sonar.security.pci.dss.version=3.2

# ========== 可维护性配置 ==========
# 最大文件长度（行）
sonar.file.maxLines=500
# 最大函数长度（行）
sonar.function.maxLines=50
# 最大类方法数
sonar.class.maxMethods=20
# 最大继承深度
sonar.inheritance.maxDepth=3

# ========== issue 管理 ==========
# 是否导入已知的 issue
sonar.issuesReport.enabled=true
sonar.issuesReport.outputPath=build/sonar/issues-report/
sonar.issuesReport.console.enable=true

# ========== 高级配置 ==========
# 编码
sonar.sourceEncoding=UTF-8
# 分析日志级别（INFO|DEBUG|TRACE）
sonar.log.level=INFO
# 分析超时时间（分钟）
sonar.analysis.timeout=60
# 是否强制使用质量门禁
sonar.qualitygate.check=true

# ========== 自定义质量配置 ==========
# 质量配置名称（需在 SonarQube 中预先创建）
# sonar.qualityProfile=YourQualityProfile

# ========== 分支分析（SonarQube Developer Edition+）==========
# sonar.branch.name=feature/my-feature
# sonar.branch.target=main

# ========== 拉取请求分析（SonarQube Developer Edition+）==========
# sonar.pullrequest.key=123
# sonar.pullrequest.branch=feature/my-feature
# sonar.pullrequest.base=main
# sonar.pullrequest.provider=GitHub
# sonar.pullrequest.github.repository=your-org/your-repo
