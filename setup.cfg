# setup.cfg - Python 打包配置文件
# 官方文档：https://setuptools.pypa.io/en/latest/userguide/declarative_config.html

[metadata]
# 项目名称（与 pyproject.toml 中的 [project] name 对应）
name = ai-agent-code-review
version = 1.0.0
description = AI Agent 自动化代码审查工作流
long_description = file: README.md
long_description_content_type = text/markdown
author = INTREBRO
author_email = your-email@example.com
maintainer = INTREBRO
maintainer_email = your-email@example.com
url = https://github.com/INTREBRO/ai-agent-code-review
project_urls =
    Documentation = https://github.com/INTREBRO/ai-agent-code-review#readme
    Repository = https://github.com/INTREBRO/ai-agent-code-review.git
    "Bug Tracker" = https://github.com/INTREBRO/ai-agent-code-review/issues
    "Discussions" = https://github.com/INTREBRO/ai-agent-code-review/discussions
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Software Development :: Quality Assurance
    Topic :: Software Development :: Testing
keywords =
    code-review
    ai
    linter
    static-analysis

[options]
# Python 版本要求
python_requires = >=3.8
# 依赖包
install_requires =
    pylint>=2.17.0
    flake8>=6.0.0
    black>=23.0.0
    isort>=5.12.0
    mypy>=1.0.0
    pytest>=7.0.0
    pytest-cov>=4.0.0
# 测试依赖
tests_require =
    pytest>=7.0.0
    pytest-cov>=4.0.0
# 额外依赖
extras_require =
    dev =
        sphinx>=7.0.0
        twine>=4.0.0
    ai =
        openai>=1.0.0
        anthropic>=0.5.0
# 包含包
packages = find:
# 包含非 Python 文件
include_package_data = True
# 脚本入口
scripts =
    .ai-review/ai-agent-review.py

[options.packages.find]
# 要包含的包
include =
    ai_review
# 要排除的包
exclude =
    tests
    tests.*
    docs
    docs.*

[options.package_data]
# 包含非 Python 文件
ai_review =
    py.typed
    config/*.json
    rules/*.json

[options.entry_points]
# 命令行入口
console_scripts =
    ai-review = ai_review.ai_agent_review:main
    ai-review-python = ai_review.ai_agent_review_py:main

[bdist_wheel]
# 构建 wheel 配置
universal = 0
python-tag = py3

[flake8]
# Flake8 配置（也可以写在 .flake8 文件中）
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .tox,
    .eggs,
    *.egg,
    .venv,
    venv,
    .venv,
    env,
    .env,
    build,
    dist,
    *.egg-info,
    .eggs,
    .stage,
    .pytest_cache,
    .coverage,
    htmlcov,

[tool:pytest]
# pytest 配置（也可以写在 pyproject.toml 中）
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --cov=ai_review
    --cov-report=term-missing
    --cov-report=html
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[coverage:run]
# coverage.py 配置
source = ai_review
omit =
    setup.py
    tests/*
    */venv/*
    */.venv/*

[coverage:report]
# coverage 报告配置
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
