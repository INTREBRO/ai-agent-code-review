# GitLeaks 配置文件
# https://github.com/zricethezav/gitleaks

[rules]
  [rules.aws-access-key]
    id = "aws-access-key"
    description = "AWS Access Key"
    regex = '''AKIA[0-9A-Z]{16}'''
    tags = ["key", "AWS"]
    severity = "CRITICAL"

  [rules.aws-secret-key]
    id = "aws-secret-key"
    description = "AWS Secret Key"
    regex = '''[0-9a-zA-Z/+]{40}'''
    tags = ["key", "AWS"]
    severity = "CRITICAL"

  [rules.github-personal-access-token]
    id = "github-personal-access-token"
    description = "GitHub Personal Access Token"
    regex = '''(ghp|gho|ghs)_[A-Za-z0-9_]{36,255}'''
    tags = ["key", "GitHub"]
    severity = "CRITICAL"
  
  [rules.github-oauth-token]
    id = "github-oauth-token"
    description = "GitHub OAuth Token"
    regex = '''gho_[A-Za-z0-9_]{36,255}'''
    tags = ["key", "GitHub"]
    severity = "CRITICAL"

  [rules.github-app-token]
    id = "github-app-token"
    description = "GitHub App Token"
    regex = '''(ghu|ghs)_[A-Za-z0-9_]{36,255}'''
    tags = ["key", "GitHub"]
    severity = "CRITICAL"

  [rules.jwt-token]
    id = "jwt-token"
    description = "JWT Token"
    regex = '''eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9._-]*'''
    tags = ["key", "JWT"]
    severity = "HGH"

  [rules.api-key-generic]
    id = "api-key-generic"
    description = "Generic API Key"
    regex = '''(api_key|apikey|api-key|api_token)["\s]*(:|=)["\s]*[A-Za-z0-9]{20,}["\s]*'''
    tags = ["key", "API"]
    severity = "HGH"

  [rules.password-in-url]
    id = "password-in-url"
    description = "Password in URL"
    regex = '''https?://[^/]+:.+@'''
    tags = ["password", "URL"]
    severity = "HGH"

  [rules.private-key]
    id = "private-key"
    description = "Private Key"
    regex = '''----BEGIN [A-Z]+ PRIVATE KEY----'''
    tags = ["key", "private"]
    severity = "CRITICAL"

  [rules.pem-certificate]
    id = "pem-certificate"
    description = "PEM Certificate"
    regex = '''----BEGIN CERTIFICATE----'''
    tags = ["certificate", "PEM"]
    severity = "HGH"

  [rules.google-api-key]
    id = "google-api-key"
    description = "Google API Key"
    regex = '''AIza[0-9A-Za-z_-]{35}'''
    tags = ["key", "Google"]
    severity = "CRITICAL"

  [rules.slack-token]
    id = "slack-token"
    description = "Slack Token"
    regex = '''xox[baprs]-[0-9a-zA-Z]{10,48}'''
    tags = ["key", "Slack"]
    severity = "CRITICAL"

  [rules.stripe-key]
    id = "stripe-key"
    description = "Stripe Key"
    regex = '''(sk|pk)_(test|live)_[0-9a-zA-Z]{24}'''
    tags = ["key", "Stripe"]
    severity = "CRITICAL"

  [rules.twilio-key]
    id = "twilio-key"
    description = "Twilio Key"
    regex = '''SK[0-9a-fA-F]{32}'''
    tags = ["key", "Twilio"]
    severity = "CRITICAL"

  [rules.sendgrid-key]
    id = "sendgrid-key"
    description = "SendGrid Key"
    regex = '''SG.[0-9a-zA-Z_-]{22}\.[0-9a-zA-Z_-]{22}'''
    tags = ["key", "SendGrid"]
    severity = "CRITICAL"

  [rules.npm-token]
    id = "npm-token"
    description = "NPM Token"
    regex = '''npm_[a-z0-9]{36}'''
    tags = ["key", "NPM"]
    severity = "CRITICAL"

# ========== 白名单（允许的文件/路径）==========
[allowlist]
  paths = [
    "*.md",
    "*.txt",
    "docs/*",
    "examples/*",
    "tests/*test*",
    "*.test.js",
    "*.spec.js",
    "*.test.ts",
    "*.spec.ts",
    "*.test.py",
    "*.spec.py"
  ]
  regexes = [
    '''.*\.test\.[jt]sx?$''',
    '''.*\.spec\.[jt]sx?$''',
    '''.*_test\.py$''',
    '''.*_spec\.py$'''
  ]
  commits = ["a-b-c-d-e-f"]  # 允许特定 commit

# ========== 黑名单（额外检查的文件/路径）==========
[blocklist]
  paths = [
    "*.env",
    "*.pem",
    "*.key",
    "*.cert",
    "config/*secret*",
    "secrets/*"
  ]

# ========== 扩展检测 ==========
[extend]
  # 使用默认规则集
  # default = true

# ========== 全局配置 ==========
[git]
  # 是否扫描整个 Git 历史
  history-scan = true
  
  # 是否扫描未提交的更改
  uncommitted = true
  
  # 是否扫描工作区文件
  worktree = true

# ========== 报告配置 ==========
[report]
  # 报告格式
  format = "json"  # json | csv | sarif
  
  # 报告输出路径
  output-path = "gitleaks-report.json"
  
  # 是否报告无漏洞（空报告）
  report-empty = false
  
  # 漏洞摘要
  summary = true
