# pyproject.toml - Python 项目配置文件
# PEP 518 定义的项目配置文件
# 官方文档：https://packaging.python.org/en/latest/specifications/pyproject-toml/

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-code-review"
version = "1.0.0"
description = "AI Agent 自动化代码审查工作流"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "INTREBRO", email = "your-email@example.com"},
]
maintainers = [
    {name = "INTREBRO", email = "your-email@example.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
keywords = ["code-review", "ai", "linter", "static-analysis"]
dependencies = [
    "pylint>=2.17.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "sphinx>=7.0.0",
    "twine>=4.0.0",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/INTREBRO/ai-agent-code-review"
Documentation = "https://github.com/INTREBRO/ai-agent-code-review#readme"
Repository = "https://github.com/INTREBRO/ai-agent-code-review.git"
"Bug Tracker" = "https://github.com/INTREBRO/ai-agent-code-review/issues"
"Discussions" = "https://github.com/INTREBRO/ai-agent-code-review/discussions"

[project.scripts]
# 命令行入口
ai-review = ".ai-review.ai_agent_review:main"
ai-review-python = ".ai-review.ai-agent-review.py:main"

# ---- 工具配置 ----

[tool.black]
# Black 代码格式化配置
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    # 要排除的目录
    \.eggs
  | \.git
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
# isort 导入排序配置
profile = "black"  # 与 Black 兼容
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", ".ai-review"]
skip = [".git", "__pycache__", "build", "dist"]

[tool.mypy]
# mypy 类型检查配置
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
exclude = [
    'build/',
    'dist/',
    '.*/',
]

[tool.pytest.ini_options]
# pytest 配置
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=.ai-review",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
# coverage.py 配置
source = [".ai-review"]
omit = [
    "setup.py",
    "tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
# coverage 报告配置
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---- 项目元数据（PEP 621）----

[tool.setuptools.packages.find]
include = ["ai_review*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"ai_review" = ["py.typed", "config/*.json", "rules/*.json"]
