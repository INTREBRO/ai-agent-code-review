# 代码质量检测流程
# 官方文档：https://docs.github.com/en/actions

name: 📊 代码质量检测

# 触发条件
on:
  # 推送到主分支
  push:
    branches: [master, main, develop]
  # PR 合并到主分支
  pull_request:
    branches: [master, main, develop]
  # 定时触发（每周一 8:00 UTC = 16:00 北京时间）
  schedule:
    - cron: '0 8 * * 1'
  # 手动触发
  workflow_dispatch:

# 权限设置
permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

# 作业定义
jobs:
  # ---- 作业 1：代码质量综合检测 ----

  code-quality:
    name: 📊 代码质量检测
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史

      - name: 🔧 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装 Node.js 依赖
        run: |
          npm ci --prefer-offline
          npm install -g eslint prettier jest

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort mypy bandit pytest pytest-cov
          pip install -r requirements.txt || true

      # ---- JavaScript 代码质量 ----

      - name: 📊 ESLint 检测（JavaScript）
        id: eslint
        run: |
          echo "::group::ESLint 检测结果"
          npx eslint . --ext .js,.jsx --format json --output-file eslint-report.json || true
          npx eslint . --ext .js,.jsx --format stylish
          echo "::endgroup::"
        continue-on-error: true

      - name: 🎨 Prettier 检测（格式化）
        id: prettier
        run: |
          echo "::group::Prettier 检测结果"
          npx prettier --check "**/*.{js,jsx,json,md}" || true
          echo "::endgroup::"
        continue-on-error: true

      - name: 🧪 Jest 测试（JavaScript）
        id: jest
        run: |
          echo "::group::Jest 测试结果"
          npm test -- --coverage --passWithNoTests || true
          echo "::endgroup::"
        continue-on-error: true

      # ---- Python 代码质量 ----

      - name: 🐍 Pylint 检测（Python）
        id: pylint
        run: |
          echo "::group::Pylint 检测结果"
          pylint **/*.py --output-format=colorized --reports=y || true
          echo "::endgroup::"
        continue-on-error: true

      - name: 🐍 Flake8 检测（Python）
        id: flake8
        run: |
          echo "::group::Flake8 检测结果"
          flake8 . --max-line-length=120 --output-file=flake8-report.txt || true
          cat flake8-report.txt
          echo "::endgroup::"
        continue-on-error: true

      - name: 🎨 Black 检测（Python 格式化）
        id: black
        run: |
          echo "::group::Black 检测结果"
          black --check --line-length=120 . || true
          echo "::endgroup::"
        continue-on-error: true

      - name: 🔃 isort 检测（导入排序）
        id: isort
        run: |
          echo "::group::isort 检测结果"
          isort --check-only . || true
          echo "::endgroup::"
        continue-on-error: true

      - name: 🔍 mypy 检测（类型检查）
        id: mypy
        run: |
          echo "::group::mypy 检测结果"
          mypy . --ignore-missing-imports || true
          echo "::endgroup::"
        continue-on-error: true

      - name: 🔒 Bandit 检测（安全扫描）
        id: bandit
        run: |
          echo "::group::Bandit 安全扫描结果"
          bandit -r . -ll -f json -o bandit-report.json || true
          bandit -r . -ll
          echo "::endgroup::"
        continue-on-error: true

      - name: 🧪 pytest 测试（Python）
        id: pytest
        run: |
          echo "::group::pytest 测试结果"
          pytest --cov=. --cov-report=term-missing --cov-report=html || true
          echo "::endgroup::"
        continue-on-error: true

      # ---- 质量报告 ----

      - name: 📊 生成质量报告
        if: always()
        run: |
          echo "## 📊 代码质量报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检测项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📏 ESLint | ${{ steps.eslint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Prettier | ${{ steps.prettier.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Jest | ${{ steps.jest.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Pylint | ${{ steps.pylint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Flake8 | ${{ steps.flake8.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Black | ${{ steps.black.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔃 isort | ${{ steps.isort.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 mypy | ${{ steps.mypy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Bandit | ${{ steps.bandit.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 pytest | ${{ steps.pytest.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📧 详细报告请查看 Artifacts" >> $GITHUB_STEP_SUMMARY

      - name: 📤 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            eslint-report.json
            flake8-report.txt
            bandit-report.json
            htmlcov/
            coverage/
          retention-days: 30

  # ---- 作业 2：SonarQube 扫描 ----

  sonarqube:
    name: 🔎 SonarQube 扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones disabled for SonarQube

      - name: 🔎 SonarQube 扫描
        uses: sonarsource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ai-agent-code-review
            -Dsonar.projectName=AI Agent Code Review
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: 🔎 SonarQube 质量门禁
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---- 作业 3：代码覆盖率 ----

  coverage:
    name: 📈 代码覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          npm ci --prefer-offline
          pip install pytest pytest-cov
          pip install -r requirements.txt || true

      - name: 📈 JavaScript 覆盖率
        run: |
          npx jest --coverage --coverageReporters=lcov
        continue-on-error: true

      - name: 📈 Python 覆盖率
        run: |
          pytest --cov=. --cov-report=lcov --cov-report=xml
        continue-on-error: true

      - name: 📤 上传到 Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 📈 覆盖率报告
        if: always()
        run: |
          echo "## 📈 代码覆盖率报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "覆盖率报告已上传到 Codecov。" >> $GITHUB_STEP_SUMMARY
          echo "请访问：https://codecov.io/gh/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY

  # ---- 作业 4：依赖漏洞扫描 ----

  dependency-scan:
    name: 🔒 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔒 Snyk 依赖扫描
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      - name: 🔒 OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ai-agent-code-review'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --enableRetired
            --enableExperimental

      - name: 📤 上传 Dependency-Check 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30

  # ---- 作业 5：总结报告 ----

  summary:
    name: 📋 质量检测总结
    runs-on: ubuntu-latest
    needs: [code-quality, sonarqube, coverage, dependency-scan]
    if: always()

    steps:
      - name: 📋 生成总结报告
        run: |
          echo "## 📋 代码质量检测总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检测项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 代码质量 | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔎 SonarQube | ${{ needs.sonarqube.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 代码覆盖率 | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 依赖扫描 | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📧 详细报告请查看：" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality Reports (Artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- SonarQube Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- Codecov Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency-Check Report (Artifacts)" >> $GITHUB_STEP_SUMMARY

      - name: ✅ 完成
        run: |
          echo "✅ 代码质量检测流程完成！"
          echo "请查看上面的总结报告和 Artifacts。"
